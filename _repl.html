<style>
#replBtn {
  position: fixed; right: 20px; bottom: 20px; z-index: 1000;
  padding: 8px 14px; border: 1px solid #d7dce3; border-radius: 999px;
  background: #fff; color: #1b1f24; font-size: 14px; cursor: pointer;
  box-shadow: 0 2px 10px rgba(0,0,0,.12);
}
#replBtn:hover { background: #f4f6f9; }
#replBox {
  position: fixed; right: 20px; bottom: 68px; z-index: 1000;
  width: min(460px, calc(100vw - 40px));
  height: min(320px, calc(100vh - 96px));   /* 낮게 시작 — 출력이 쌓이면 ⤢ 로 키운다 */
  max-height: calc(100vh - 96px);
  display: flex; flex-direction: column;
  border: 1px solid #d7dce3; border-radius: 10px; overflow: hidden;
  background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.18);
  resize: both; min-width: 300px; min-height: 240px;
}
#replBox iframe { flex: 1 1 auto; width: 100%; border: 0; display: block; min-height: 0; }
#replBar {
  flex: 0 0 auto;
  display: flex; gap: 6px; align-items: center; justify-content: flex-end;
  padding: 4px 8px; border-bottom: 1px solid #e7ebf2; background: #fafbfc;
  font-size: 12px; color: #6b7480;
}
#replBar .grow { margin-right: auto; }
#replBar button {
  border: 1px solid #d7dce3; border-radius: 6px; background: #fff;
  padding: 2px 8px; font-size: 12px; cursor: pointer; color: #1b1f24;
}
#replBox.wide {
  width: min(900px, calc(100vw - 40px));
  height: min(680px, calc(100vh - 96px));
}
@media (max-width: 700px) {
  #replBox { right: 10px; left: 10px; width: auto; }
}
</style>

<!-- 떠 있는 실행창 — AM2026-Play (JupyterLite · R webR / Python Pyodide) -->
<button id="replBtn" type="button">▶ 실행창</button>

<div id="replBox" hidden>
  <div id="replBar">
    <span class="grow">실행창</span>
    <button type="button" data-kernel="R" title="R (webR) — 안 붙으면 한 번 더 누르십시오">R</button>
    <button type="button" data-kernel="python">Python</button>
    <button type="button" id="replWide" title="넓게">⤢</button>
    <button type="button" id="replLab" title="노트북(JupyterLab) 새 창">↗ Lab</button>
    <button type="button" id="replClose" title="닫기">✕</button>
  </div>
  <iframe id="replFrame" title="AM2026 실행창" loading="lazy"></iframe>
</div>

<script>
(function () {
  var BASE = "https://guebin.github.io/AM2026-Play/repl/index.html";
  var btn = document.getElementById("replBtn");
  var box = document.getElementById("replBox");
  var frame = document.getElementById("replFrame");
  if (!btn || !box || !frame) return;

  // ★ R 커널 이름 후보 — 배포본에서 어느 것이 맞는지 확실치 않아 순서대로 시도한다
  var R_NAMES = ["webR", "webr"];
  var rIdx = 0;
  try { rIdx = parseInt(localStorage.getItem("am2026-repl-ridx") || "0", 10) || 0; } catch (e) {}

  var current = localStorage.getItem("am2026-repl-kernel") || "R";

  function kernelParam(which) {
    return (which === "python") ? "python" : R_NAMES[rIdx % R_NAMES.length];
  }

  function load(which) {
    current = which;
    try { localStorage.setItem("am2026-repl-kernel", which); } catch (e) {}
    var want = BASE + "?kernel=" + kernelParam(which) + "&toolbar=1";
    frame.setAttribute("src", want);
    box.querySelectorAll("[data-kernel]").forEach(function (b) {
      b.style.fontWeight = (b.dataset.kernel === which) ? "700" : "400";
    });
  }

  btn.addEventListener("click", function () {
    box.hidden = !box.hidden;                       // 접어도 iframe 은 살아 있다 (변수 유지)
    btn.textContent = box.hidden ? "▶ 실행창" : "▼ 실행창";
    if (!box.hidden && !frame.getAttribute("src")) load(current);
  });

  box.querySelectorAll("[data-kernel]").forEach(function (b) {
    b.addEventListener("click", function () {
      // ★ R 을 이미 보고 있는데 다시 누르면 «다른 이름»으로 바꿔 다시 띄운다
      if (b.dataset.kernel === "R" && current === "R") {
        rIdx = (rIdx + 1) % R_NAMES.length;
        try { localStorage.setItem("am2026-repl-ridx", String(rIdx)); } catch (e) {}
      }
      load(b.dataset.kernel);
    });
  });

  document.getElementById("replClose").addEventListener("click", function () {
    box.hidden = true; btn.textContent = "▶ 실행창";
  });

  document.getElementById("replWide").addEventListener("click", function () {
    box.classList.toggle("wide");
  });

  document.getElementById("replLab").addEventListener("click", function () {
    // ★ 크기를 주면 브라우저가 «별도 창»으로 연다 (탭이 아니라)
    var w = Math.min(1200, Math.round(screen.availWidth  * 0.8));
    var h = Math.min(860,  Math.round(screen.availHeight * 0.85));
    var x = Math.round((screen.availWidth  - w) / 2);
    var y = Math.round((screen.availHeight - h) / 2);
    window.open(
      "https://guebin.github.io/AM2026-Play/lab/index.html",
      "am2026lab",
      "popup=yes,width=" + w + ",height=" + h + ",left=" + x + ",top=" + y +
      ",noopener,resizable=yes,scrollbars=yes"
    );
  });
})();
</script>
